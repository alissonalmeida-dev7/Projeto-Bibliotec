<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliotec - Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="shortcut icon" href="../imgs/Icone - Bibliotec.png" type="image/x-icon">
</head>
<body>

    <header class="header">
        <a href="#">
            <img src="../imgs/Logo Horizontal - branca.svg" alt="Logo do Sistema Bibliotec">
        </a>

        <nav class="navigation">
            <a href="../home/home.html">Home</a>
        </nav>
    </header>

    <main class="content">

        <section class="login">
            <div class="header-login">
                <img src="../imgs/Icone - Bibliotec.png" alt="Logo Bibliotec">

                <h1>Bem vindo(a) à Bibliotec</h1>
                <p>Acesse sua conta para continuar</p>
            </div>

            <form>

                <div class="camp">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="email@alunosenai.com">
                </div>

                <div class="camp">
                    <label for="password">Senha</label>
                    <div class="password-camp">
                        <input type="password" id="password" 
                        placeholder="*******">

                        <button id="show-password" class="eye-button">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <button class="enter-button">Entrar</button>
                <button class="google-button">
                    <img src="../imgs/icone-google.svg" alt="Google Logo">
                    <span>Continuar com Google</span>
                </button>

            </form>
        </section>
        
    </main>

    <script src="login.js"></script>

</body>
</html>
